<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/37d1147389.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Chalo Chale Travel App - Login Up</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12 p-0 m-0">
                <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
                    <div class="container">
                        <a href="#" class="navbar-brand fw-bold">
                            <i class="fa-solid fa-plane-departure"></i> ChaloChale
                        </a>
                        
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#menu">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="menu">
                            <ul class="navbar-nav ms-auto">
                                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                                <li class="nav-item"><a href="destinations.html" class="nav-link">Destinations</a></li>
                                <li class="nav-item"><a href="packages.html" class="nav-link">Packages</a></li>
                                <li class="nav-item"><a href="booking.html" class="nav-link">Booking</a></li>
                                <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                                <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
                            </ul>
                            <a href="signup.html" class="btn btn-warning ms-lg-3">Sign Up</a>
                            <a href="login.html" class="btn btn-warning ms-lg-3">Login</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <!-- Navbar End -->
    <!-- Sign Up Form -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-lg p-4 rounded-4">
                        <h3 class="text-center mb-4 fw-bold">
                            Sign In
                        </h3>
                        <form>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email address">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password">
                            </div>
                            
                            <button class="btn btn-success w-100">Login</button>
                            <p class="text-center mt-3">
                                New User? <a href="signup.html" class="text-decoration-none"> Sign Up</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
